# Configuración del microservicio IoT Access Management de Edifika.
spring.application.name=Edifika-Microservice-IoT-Access-Management

# Servidor
server.port=${PORT:8089}

# DB Local PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/access_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.edifika.access.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# JWT
jwt.secret=${JWT_SECRET:edifika-secret-key-must-be-at-least-32-characters-long}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# Documentación
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# Integración y dominio
integration.residential-url=${RESIDENTIAL_SERVICE_URL:http://localhost:8081}
integration.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
integration.debt-check-enabled=${DEBT_CHECK_ENABLED:true}
integration.debt-check-interval-minutes=${DEBT_CHECK_INTERVAL_MINUTES:5}
integration.device-command-ttl-seconds=${DEVICE_COMMAND_TTL_SECONDS:10}
integration.reservation-max-hours=${RESERVATION_MAX_HOURS:12}
integration.timezone=${ACCESS_TIMEZONE:America/Lima}
integration.timeout-seconds=5
